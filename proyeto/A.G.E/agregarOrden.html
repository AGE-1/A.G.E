</head>
<body>
    <body>
<div class="contenedor">
    <h1 class="tit">Calculadora de producción</h1>
    <aside class="navlateral">
        <div class="nav">
            <nav>
                <ul>
                    <img src="image/logo_fondo_negro.png" alt="Logo de la empresa" class="logonav" width="100">
                    <li><i class="fa-solid fa-house" id="dashb"></i><a href="dashboard.html">Dashboard</a></li>
                    <li><i class="fa-solid fa-gear"></i><a href="configuracion.html">Configuración</a></li>
                    <li><i class="fa-solid fa-people-group"></i><a href="clientes.html">Clientes</a></li>
                    <li><i class="fa-solid fa-file-invoice"></i><a href="facturacion.html">Facturación</a></li>
                    <li><i class="fa-solid fa-user-group"></i><a href="empleados.html">Empleados</a></li>
                    <li><i class="fa-solid fa-boxes-stacked"></i><a href="inventario.html">Inventario</a></li>
                    <li class="seleccionadoNav"><i class="fa-solid fa-gears"></i><a href="produccion.html">Producción</a></li>
                    <li><i class="fa-solid fa-chart-line"></i><a href="estadisticasGenerales.html">Estadísticas</a></li>
                </ul>
                <p class="footerNav" style="color: #fff;">2026 A.G.E. Todos los derechos reservados.&#174;</p>
            </nav>
        </div>
     </aside>
    <div class="agregarfactura">
        <div class="formulario">
                <div class="opcionesF">
                <label for="product-nom">Nombre del producto *</label>
                <input type="text" id="product-nom" required placeholder="champu">
                <label for="cant-prod">Cantidad a producir *</label>
                <input type="text" id="cant-prod" required placeholder="0">
                <label for="cost-unidad">Costo por unidad *</label>
                <input type="number" id="cost-unidad" min="0" placeholder="0">
                <label for="tasa-interes">Plazo de trabajo (HR'S) *</label>
                <input type="number" id="tasa-interes" min="0" step="1" placeholder="0">

        </div>

        <h3>Detalles de Orden </h3>

        <div class="items-carrito" id="factura-items">
            <div>Sin productos aún</div>
        </div>

        <div class="resumen-venta">
            <div class="resumen-fila">
                <span>Subtotal:</span>
                <span id="fact-subtotal">$0.00</span>
            </div>
            <div class="resumen-fila">
                <span>IVA (16%):</span>
                <span id="fact-iva">$0.00</span>
            </div>
            <div id="interes-container" style="display: none;">
                <div class="resumen-fila">
                    <span>Interés:</span>
                    <span id="fact-interes">$0.00</span>
                </div>
            </div>
            <div class="resumen-fila total">
                <span>TOTAL:</span>
                <span id="fact-total">$0.00</span>
            </div>
        </div>

        <div class="btn-aniado crearfactura-btn">
                <a href="#"><input type="button" value="Generar Orden" style="width: 120px;"></a>
                <a href="#"><input type="button" value="Limpiar" style="width: 120px;"></a>
        </div>

        <div class="btn-aniado">
            <a href="#"><input type="button" value="Imprimir" ></a>
        </div>
    </div>
</div>
</body>
</body>
</html>
