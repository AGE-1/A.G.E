<body>
<div class="contenedor">
    <h1 class="tit">Empleados</h1>
    <aside class="navlateral">
        <div class="nav">
            <nav>
                <ul>
                    <img src="image/logo_fondo_negro.png" alt="Logo de la empresa" class="logonav" width="100">
                    <li><i class="fa-solid fa-house" id="dashb"></i><a href="dashboard.html">Dashboard</a></li>
                    <li><i class="fa-solid fa-gear"></i><a href="configuracion.html">Configuración</a></li>
                    <li><i class="fa-solid fa-people-group"></i><a href="clientes.html">Clientes</a></li>
                    <li><i class="fa-solid fa-file-invoice"></i><a href="facturacion.html">Facturación</a></li>
                    <li class="seleccionadoNav"><i class="fa-solid fa-user-group"></i><a href="#">Empleados</a></li>
                    <li><i class="fa-solid fa-boxes-stacked"></i><a href="inventario.html">Inventario</a></li>
                    <li><i class="fa-solid fa-gears"></i><a href="produccion.html">Producción</a></li>
                    <li><i class="fa-solid fa-chart-line"></i><a href="estadisticasGenerales.html">Estadísticas</a></li>
                </ul>
                <p class="footerNav" style="color: #fff;">2026 A.G.E. Todos los derechos reservados.&#174;</p>
            </nav>
        </div>
    </aside>
    <section class="agregar-cliente">
        <form>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" required>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" required>

            <label for="Identificacion">Identificacion:</label>
            <input type="number" id="Identificacion">

            <label for="area">Area:</label>
            <select name="" id="area">
                <option value="">Produccion</option>
                <option value="">Ventas</option>
                <option value="">Compras</option>
                <option value="">Otra</option>
            </select>
            

            <label for="Horario">Horario:</label>
            <input type="time" id="Horario">

            <textarea name="Descripcion" id="Descripcion-cliente" placeholder="Agregar descripcion"></textarea>

            <input type="reset" value="Eliminar" id="eliminarclientebtn">
        </form>
        

        <img src="image/logo_fondo_negro.png" alt="Agregar imagen cliente"id="imagen-AniadirCliente">

        <a href="clientes.html" id="regresar-clientes"><</a>
    </section>
</div>
</body>
